# Replaces keys of src/main/resources/biometrics.yml (generate.biometrics.override_file).
# Adult weight: each person draws one yearly gain from the range and keeps it (the upstream file
# draws it again every year, so everybody ends up with a similar BMI and the spread is too narrow).
# The ranges were set so that adults reach about 61% with BMI 25 or more and 25% with BMI 30 or
# more (age-standardised), close to the measured shares of Greece and Albania (WHO, 2024).
# Weight loss starts at 70 (upstream 60) and nobody starts the weight management program that the
# upstream module gives to 49.3% of adults with BMI 30 or more (a United States figure): it holds
# their weight at about BMI 30 for years and kept obesity at about 12% (see LOCALIZATION_LOG.md).
lifecycle:
  adult_weight_gain_mode: person
  adult_weight_gain: [0.0, 1.0]     # kilograms per year, up to age 49
  geriatric_weight_loss: [0.3, 0.6] # kilograms per year, from the age below
  geriatric_weight_loss_age: 70
# Read at the top level of the file by the weight loss module (upstream keeps its values under
# 'weightloss:', where the code does not look)
start_prob: 0.0
