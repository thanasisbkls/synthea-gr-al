# Shared by Greece and Albania. Load first, then the country file:
#   ./run_synthea -c config/common/synthea.properties -c config/<cc>/synthea.properties <STNAME> <NAME>
generate.only_alive_patients = true

# Exports: CSV and text only, no FHIR
exporter.fhir.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.csv.export = true
exporter.text.export = true

# Providers. Only hospitals, primary care and urgent care are used. Veterans must exist
# (header-only file); the optional types are skipped with an empty value. The loader keeps only
# rows for the run's state, so the US files would load nothing anyway.
generate.providers.veterans.default_file = config/common/providers/empty.csv
generate.providers.ihs.hospitals.default_file =
generate.providers.ihs.primarycare.default_file =
generate.providers.homehealth.default_file =
generate.providers.hospice.default_file =
generate.providers.nursing.default_file =
# Unit is DEGREES of lat/lon (not km, despite the default file's comment): the search starts at
# 0.125 and doubles up to this value. 1 degree is about 100 km.
generate.providers.maximum_search_distance = 1

# Payers: no payer data, so the files are header-only and every patient is uninsured
# (Synthea's built-in NO_INSURANCE payer). The US Medicare/Medicaid/Dual Eligible names stay at
# their defaults; they match nothing because no payer exists.
generate.payers.insurance_companies.default_file = config/common/payers/insurance_companies.csv
generate.payers.insurance_plans.default_file = config/common/payers/insurance_plans.csv
generate.payers.insurance_plans.eligibilities_file = config/common/payers/insurance_eligibilities.csv

# Names: no digits appended
generate.append_numbers_to_person_names = false
