# Albania (Finiq). Load after config/common/synthea.properties.
generate.geography.country_code = AL
# Everyone speaks Albanian (names, addresses and birthplaces follow it); race and ethnicity are placeholders
generate.geography.language = albanian

# Each country writes to its own output folder, so the two countries never overwrite or mix records
exporter.baseDirectory = ./output/al/

# Geography files: settlements, postal codes, timezone
generate.demographics.default_file = config/al/geography/demographics.csv
generate.geography.zipcodes.default_file = config/al/geography/zipcodes.csv
generate.geography.timezones.default_file = config/al/geography/timezones.csv
# Social determinants of health switched off: all five probabilities are 0
generate.geography.sdoh.default_file = config/al/geography/sdoh.csv

# Income thresholds in EUR (poverty = 60% of national median 5,785; high = top-decile cut-off)
generate.demographics.socioeconomic.income.poverty = 3471
generate.demographics.socioeconomic.income.high = 11702

# Socioeconomic category thresholds (scores of 0 to 1). The disease modules' risks per category (Low,
# Middle, High) were set for the US, where the upstream thresholds give about 4% Low, 64% Middle and 32% High.
# These two values give the Albanian demographics the same shares, so a category means the same
# relative position. Derived with scripts/ses_thresholds.py al.
generate.demographics.socioeconomic.score.middle = 0.107
generate.demographics.socioeconomic.score.high = 0.440

# Providers
generate.providers.hospitals.default_file = config/al/providers/hospitals.csv
generate.providers.primarycare.default_file = config/al/providers/primary_care_facilities.csv
# no public urgent-care unit: header-only file, so urgent care falls back to the hospital
generate.providers.urgentcare.default_file = config/al/providers/urgent_care_facilities.csv

# Immunization schedule
generate.immunization.schedule.default_file = config/al/immunization_schedule.json

# COVID-19 vaccination: this country's rollout, eligibility, vaccines and uptake by age
generate.covid.vaccination.default_file = config/al/covid_vaccination.json

# Deaths by age. The disease modules kill too few people at old age and none in infancy, so natural
# deaths are on, with a yearly risk by age that tops up what the modules already cause to the WHO
# death rates of Albania (2023). Derived with scripts/death_risks.py --country al.
lifecycle.death_by_natural_causes = true
lifecycle.death_risk_file = config/al/death_risks.csv


# Smoking. The veteran modules were the only source of smokers, so the share of 16 year olds who
# start smoking is set by sex, with a lower yearly quit chance. Fitted so that adults reach the
# WHO current smoking prevalence of Albania (2024: men 36.7%, women 6.1%).
lifecycle.smoking.start_probability.male = 0.53
lifecycle.smoking.start_probability.female = 0.11
lifecycle.quit_smoking.baseline = 0.0001
