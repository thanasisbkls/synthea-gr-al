# Albania (Finiq). Load after config/common/synthea.properties.
generate.geography.country_code = AL

# Each country writes to its own output folder, so the two countries never overwrite or mix records
exporter.baseDirectory = ./output/al/

# Geography files: settlements, postal codes, timezone
generate.demographics.default_file = config/al/geography/demographics.csv
generate.geography.zipcodes.default_file = config/al/geography/zipcodes.csv
generate.geography.timezones.default_file = config/al/geography/timezones.csv
# Social determinants of health switched off: all five probabilities are 0
generate.geography.sdoh.default_file = config/al/geography/sdoh.csv

# Income thresholds in EUR (poverty = 60% of national median 5,785; high = top-decile cut-off)
generate.demographics.socioeconomic.income.poverty = 3471
generate.demographics.socioeconomic.income.high = 11702

# Providers
generate.providers.hospitals.default_file = config/al/providers/hospitals.csv
generate.providers.primarycare.default_file = config/al/providers/primary_care_facilities.csv
# no public urgent-care unit: header-only file, so urgent care falls back to the hospital
generate.providers.urgentcare.default_file = config/al/providers/urgent_care_facilities.csv
