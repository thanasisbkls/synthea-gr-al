# Greece (Filiates). Load after config/common/synthea.properties.
generate.geography.country_code = GR

# Each country writes to its own output folder, so the two countries never overwrite or mix records
exporter.baseDirectory = ./output/gr/

# Geography files: settlements, postal codes, timezone
generate.demographics.default_file = config/gr/geography/demographics.csv
generate.geography.zipcodes.default_file = config/gr/geography/zipcodes.csv
generate.geography.timezones.default_file = config/gr/geography/timezones.csv

# Income thresholds in EUR (poverty = 60% of national median 11,700; high = top-decile cut-off)
generate.demographics.socioeconomic.income.poverty = 7020
generate.demographics.socioeconomic.income.high = 20796

# Providers
generate.providers.hospitals.default_file = config/gr/providers/hospitals.csv
generate.providers.primarycare.default_file = config/gr/providers/primary_care_facilities.csv
generate.providers.urgentcare.default_file = config/gr/providers/urgent_care_facilities.csv
