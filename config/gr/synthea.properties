# Greece (Filiates). Load after config/common/synthea.properties.
generate.geography.country_code = GR
# Everyone speaks Greek (names, addresses and birthplaces follow it); race and ethnicity are placeholders
generate.geography.language = greek

# Each country writes to its own output folder, so the two countries never overwrite or mix records
exporter.baseDirectory = ./output/gr/

# Geography files: settlements, postal codes, timezone
generate.demographics.default_file = config/gr/geography/demographics.csv
generate.geography.zipcodes.default_file = config/gr/geography/zipcodes.csv
generate.geography.timezones.default_file = config/gr/geography/timezones.csv
# Social determinants of health switched off: all five probabilities are 0
generate.geography.sdoh.default_file = config/gr/geography/sdoh.csv

# Income thresholds in EUR (poverty = 60% of national median 11,700; high = top-decile cut-off)
generate.demographics.socioeconomic.income.poverty = 7020
generate.demographics.socioeconomic.income.high = 20796

# Socioeconomic category thresholds (scores of 0 to 1). The disease modules' risks per category (Low,
# Middle, High) were set for the US, where the upstream thresholds give about 4% Low, 64% Middle and 32% High.
# These two values give the Greek demographics the same shares, so a category means the same
# relative position. Derived with scripts/ses_thresholds.py gr.
generate.demographics.socioeconomic.score.middle = 0.106
generate.demographics.socioeconomic.score.high = 0.439

# Providers
generate.providers.hospitals.default_file = config/gr/providers/hospitals.csv
generate.providers.primarycare.default_file = config/gr/providers/primary_care_facilities.csv
generate.providers.urgentcare.default_file = config/gr/providers/urgent_care_facilities.csv

# Immunization schedule
generate.immunization.schedule.default_file = config/gr/immunization_schedule.json

# COVID-19 vaccination: this country's rollout, eligibility, vaccines and uptake by age
generate.covid.vaccination.default_file = config/gr/covid_vaccination.json
